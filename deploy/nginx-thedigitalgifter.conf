# nginx snippet for The Digital Gifter SPA (VPS)
# Place in /etc/nginx/sites-available/thedigitalgifter.com

server {
    listen 80;
    listen [::]:80;
    server_name thedigitalgifter.com www.thedigitalgifter.com;

    root /var/www/thedigitalgifter;
    index index.html;

    # Static assets — long cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Christmas gift tree media (versioned via ?v= query stamp)
    location /christmas/gifts/ {
        try_files $uri =404;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Apple Pay domain association — required for Express Checkout wallets
    location = /.well-known/apple-developer-merchantid-domain-association {
        default_type application/octet-stream;
        try_files /.well-known/apple-developer-merchantid-domain-association =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Christmas + pet funnels call Supabase Edge directly from the browser.
    # Legacy /api/* routes are optional; proxy to Supabase or a Node sidecar if needed:
    # location /api/ {
    #     proxy_pass https://kjlsocejpmnzhhduyumy.supabase.co/functions/v1/;
    # }
}
