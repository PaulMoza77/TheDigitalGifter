# TheDigitalGifter compose — reads permanent VPS secrets at build/runtime.
# Application source is expected at /opt/mozas/projects/thedigitalgifter/repo.
# Does not change TheMozas, VoloCar, or the secrets directory contents except TDG_RELEASE.
name: thedigitalgifter

services:
  thedigitalgifter:
    image: mozas/thedigitalgifter:${TDG_RELEASE:-latest}
    container_name: thedigitalgifter
    build:
      context: /opt/mozas/projects/thedigitalgifter/repo
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-}
    restart: unless-stopped
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_APP_URL: ${VITE_APP_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLIP_FACTORY_CRON_SECRET: ${CLIP_FACTORY_CRON_SECRET:-${CRON_SECRET:-}}
      CLIP_FACTORY_IMPORT_WORKER_TOKEN: ${CLIP_FACTORY_IMPORT_WORKER_TOKEN:-}
      CLIP_FACTORY_MEDIA_ROOT: /var/lib/tdg/clip-factory
      LONG_FORM_DATA_DIR: /data/long-form
      CLIP_FACTORY_SIGNING_SECRET: ${CLIP_FACTORY_SIGNING_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CLIP_FACTORY_YOUTUBE_IMPORT_URL: ${CLIP_FACTORY_YOUTUBE_IMPORT_URL:-}
      CLIP_FACTORY_YOUTUBE_IMPORT_SECRET: ${CLIP_FACTORY_YOUTUBE_IMPORT_SECRET:-}
      CLIP_INGEST_PROVIDER: ${CLIP_INGEST_PROVIDER:-auto}
      CLIP_INGEST_ENDPOINT: ${CLIP_INGEST_ENDPOINT:-}
      CLIP_INGEST_API_KEY: ${CLIP_INGEST_API_KEY:-}
      CLIP_INGEST_FALLBACK_PROVIDER: ${CLIP_INGEST_FALLBACK_PROVIDER:-ytdlp}
      VIMEO_ACCESS_TOKEN: ${VIMEO_ACCESS_TOKEN:-}
      CHRISTMAS_SANTA_COMPOSE_SECRET: ${CHRISTMAS_SANTA_COMPOSE_SECRET:-}
      STRIPE_APPLE_PAY_DOMAIN_ASSOCIATION: ${STRIPE_APPLE_PAY_DOMAIN_ASSOCIATION:-}
      PET_FULFILLMENT_ENABLED: ${PET_FULFILLMENT_ENABLED:-true}
      CHRISTMAS_CHECKOUT_ENABLED: ${CHRISTMAS_CHECKOUT_ENABLED:-false}
      CHRISTMAS_PLANNER_CHECKOUT_ENABLED: ${CHRISTMAS_PLANNER_CHECKOUT_ENABLED:-false}
      # Pass through existing VPS secrets/app.env values. Empty if unset.
      HF_CREDENTIALS: ${HF_CREDENTIALS:-}
      HF_API_KEY_ID: ${HF_API_KEY_ID:-}
      HF_API_KEY_SECRET: ${HF_API_KEY_SECRET:-}
      VERCEL_ENV: production
      TDG_RELEASE: ${TDG_RELEASE:-latest}
      LONG_FORM_DATA_DIR: /data/long-form
    volumes:
      - /opt/mozas/projects/thedigitalgifter/data/long-form:/data/long-form
    expose:
      - "8080"
    volumes:
      - /opt/mozas/projects/thedigitalgifter/media:/var/lib/tdg/clip-factory
      - /opt/mozas/projects/thedigitalgifter/data/long-form:/data/long-form
    networks:
      - mozas-edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    profiles:
      - with-app

networks:
  mozas-edge:
    name: mozas-edge
    external: true
