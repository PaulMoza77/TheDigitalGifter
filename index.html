    <!-- /christmas/santa-call: paint hero H1 before SPA JS so LCP is not blocked by the bundle -->
    <script>
      (function () {
        if (!window.__TDG_SANTA_LANDING__) return;
        window.__TDG_SANTA_BOOT__ = true;
        var params = new URLSearchParams(location.search || "");
        var lang = String(params.get("lang") || "").toLowerCase();
        if (!lang) {
          try {
            lang = String(navigator.language || "ro").toLowerCase();
          } catch (e) {
            lang = "ro";
          }
        }
        var ro = lang.indexOf("en") !== 0;
        var market = params.get("market") === "us" ? "us" : "ro";
        var copy = ro
          ? {
              kicker: "APEL CU MOȘ CRĂCIUN · ÎN ROMÂNĂ",
              title: "Îi spune pe nume. Îi ascultă dorințele. Îi răspunde.",
              subtitle:
                "O conversație de 3 minute cu un Moș Crăciun virtual, creat cu AI.",
              price: market === "us" ? "$9.99 / 3 minute" : "59 lei / 3 minute",
              cta: "Personalizează apelul",
            }
          : {
              kicker: "A CALL WITH SANTA · MADE PERSONAL",
              title: "He knows their name. Hears their wishes. Answers back.",
              subtitle:
                "A 3-minute conversation with an AI Santa in your browser.",
              price: market === "us" ? "$9.99 / 3 minutes" : "59 lei / 3 minutes",
              cta: "Personalize the call",
            };

        var fontHref =
          "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap";
        function add(rel, attrs) {
          var el = document.createElement("link");
          el.rel = rel;
          Object.keys(attrs).forEach(function (k) {
            el.setAttribute(k, attrs[k]);
          });
          document.head.appendChild(el);
        }
        add("preload", { as: "style", href: fontHref, "data-sc-fonts-preload": "1" });
        add("stylesheet", { href: fontHref, id: "tdg-santa-call-fonts" });

        var bootCss = document.createElement("style");
        bootCss.id = "sc-boot-css";
        bootCss.textContent =
          "html,body{margin:0;background:#fcf8f0;color:#263c32}" +
          "#sc-boot{font-family:'Source Sans 3',system-ui,sans-serif;max-width:1160px;margin:0 auto;padding:16px}" +
          "#sc-boot .sc-boot-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;color:#82633a;margin:18px 0 10px}" +
          "#sc-boot h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(34px,9vw,48px);line-height:1.05;letter-spacing:-.025em;margin:0 0 12px}" +
          "#sc-boot .sc-boot-sub{font-size:15px;line-height:1.45;color:#5b675e;margin:0 0 12px;max-width:32rem}" +
          "#sc-boot .sc-boot-price{font-weight:700;font-size:26px;margin:0 0 12px}" +
          "#sc-boot .sc-boot-cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 24px;border-radius:12px;background:#9e302b;color:#fff;font-weight:700;font-size:16px;width:100%;max-width:420px;box-sizing:border-box}";
        document.head.appendChild(bootCss);

        function paintBoot() {
          if (document.getElementById("sc-boot")) return;
          var boot = document.createElement("div");
          boot.id = "sc-boot";
          boot.setAttribute("data-sc-boot", "1");
          boot.innerHTML =
            '<p class="sc-boot-kicker">' +
            copy.kicker +
            "</p>" +
            '<h1 id="santa-title">' +
            copy.title +
            "</h1>" +
            '<p class="sc-boot-sub">' +
            copy.subtitle +
            "</p>" +
            '<p class="sc-boot-price">' +
            copy.price +
            "</p>" +
            '<div class="sc-boot-cta" aria-hidden="true">' +
            copy.cta +
            "</div>";
          (document.body || document.documentElement).appendChild(boot);
        }
        if (document.body) paintBoot();
        else document.addEventListener("DOMContentLoaded", paintBoot);
      })();
    </script>

    <!-- /christmas: paint cabin poster + start asset fetch before the SPA boots -->
    <script>
      (function () {
        var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
        if (path !== "/christmas") return;
        window.__TDG_CHRISTMAS_BOOT__ = true;
        document.documentElement.style.background = "#0b0504";
        document.documentElement.style.colorScheme = "dark";

        function add(rel, attrs) {
          var el = document.createElement("link");
          el.rel = rel;
          Object.keys(attrs).forEach(function (k) {
            el.setAttribute(k, attrs[k]);
          });
          document.head.appendChild(el);
          return el;
        }

        add("preload", {
          as: "style",
          href: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap",
          "data-cc-boot": "fonts-preload",
        });
        add("stylesheet", {
          href: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap",
          id: "christmas-club-fonts",
        });

        var wide = window.matchMedia("(min-width: 901px)").matches;
        var heroStill = wide
          ? "/christmas/cabin-hero-1920.webp"
          : "/christmas/cabin-hero-1280.webp";
        add("preload", {
          as: "image",
          type: "image/webp",
          href: heroStill,
          imagesrcset:
            "/christmas/cabin-hero-1280.webp 1280w, /christmas/cabin-hero-1920.webp 1920w, /christmas/cabin-hero-2560.webp 2560w",
          imagesizes: "100vw",
          fetchpriority: "high",
          "data-cc-preload": "hero",
        });
        add("preload", {
          as: "video",
          href: wide
            ? "/christmas/cabin-hero-loop.mp4?v=seedance1"
            : "/christmas/cabin-hero-loop-720.mp4?v=seedance1",
          "data-cc-preload": "loop",
        });

        var bootCss = document.createElement("style");
        bootCss.id = "cc-boot-css";
        bootCss.textContent =
          "html,body{margin:0;background:#0b0504}" +
          "#cc-boot{position:fixed;inset:0;z-index:0;pointer-events:none;" +
          "background:#0b0504 url(" +
          heroStill +
          ") " +
          (wide ? "center" : "72% 42%") +
          "/cover no-repeat}" +
          "#cc-boot::after{content:'';position:absolute;inset:0;" +
          "background:linear-gradient(180deg,rgba(8,3,2,.34) 0%,rgba(8,3,2,.08) 28%,rgba(8,3,2,.28) 58%,rgba(8,3,2,.78) 100%)," +
          "linear-gradient(90deg,rgba(8,3,2,.42) 0%,transparent 34%,transparent 66%,rgba(8,3,2,.28) 100%)}";
        document.head.appendChild(bootCss);

        function paintBoot() {
          if (document.getElementById("cc-boot")) return;
          var boot = document.createElement("div");
          boot.id = "cc-boot";
          boot.setAttribute("aria-hidden", "true");
          (document.body || document.documentElement).appendChild(boot);
        }
        if (document.body) paintBoot();
        else document.addEventListener("DOMContentLoaded", paintBoot);
      })();
    </script>

    <!-- Inter is skipped on Santa Call so Cormorant/Source Sans win the critical path. -->
    <script>
      (function () {
        if (window.__TDG_SANTA_LANDING__) return;
        var href =
          "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap";
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "style";
        link.href = href;
        link.onload = function () {
          this.onload = null;
          this.rel = "stylesheet";
        };
        document.head.appendChild(link);
        var noscript = document.createElement("noscript");
        noscript.innerHTML = '<link href="' + href + '" rel="stylesheet" />';
        document.head.appendChild(noscript);
      })();
    </script>
