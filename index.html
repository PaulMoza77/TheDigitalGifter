    <!-- /christmas: paint cabin poster + start asset fetch before the SPA boots -->
    <script>
      (function () {
        var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
        if (path !== "/christmas") return;
        window.__TDG_CHRISTMAS_BOOT__ = true;
        document.documentElement.style.background = "#0b0504";
        document.documentElement.style.colorScheme = "dark";

        function add(rel, attrs) {
          var el = document.createElement("link");
          el.rel = rel;
          Object.keys(attrs).forEach(function (k) {
            el.setAttribute(k, attrs[k]);
          });
          document.head.appendChild(el);
          return el;
        }

        add("preload", {
          as: "style",
          href: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap",
          "data-cc-boot": "fonts-preload",
        });
        add("stylesheet", {
          href: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap",
          id: "christmas-club-fonts",
        });

        var wide = window.matchMedia("(min-width: 901px)").matches;
        add("preload", {
          as: "image",
          type: "image/webp",
          href: "/christmas/cabin-hero-1920.webp",
          imagesrcset:
            "/christmas/cabin-hero-1280.webp 1280w, /christmas/cabin-hero-1920.webp 1920w, /christmas/cabin-hero-2560.webp 2560w",
          imagesizes: "100vw",
          fetchpriority: "high",
          "data-cc-preload": "hero",
        });
        add("preload", {
          as: "video",
          href: wide
            ? "/christmas/cabin-hero-loop.mp4?v=seedance1"
            : "/christmas/cabin-hero-loop-720.mp4?v=seedance1",
          "data-cc-preload": "loop",
        });

        var bootCss = document.createElement("style");
        bootCss.id = "cc-boot-css";
        bootCss.textContent =
          "html,body{margin:0;background:#0b0504}" +
          "#cc-boot{position:fixed;inset:0;z-index:0;pointer-events:none;" +
          "background:#0b0504 url(/christmas/cabin-hero-1920.webp) center/cover no-repeat}" +
          "#cc-boot::after{content:'';position:absolute;inset:0;" +
          "background:linear-gradient(180deg,rgba(8,3,2,.34) 0%,rgba(8,3,2,.08) 28%,rgba(8,3,2,.28) 58%,rgba(8,3,2,.78) 100%)," +
          "linear-gradient(90deg,rgba(8,3,2,.42) 0%,transparent 34%,transparent 66%,rgba(8,3,2,.28) 100%)}";
        document.head.appendChild(bootCss);

        function paintBoot() {
          if (document.getElementById("cc-boot")) return;
          var boot = document.createElement("div");
          boot.id = "cc-boot";
          boot.setAttribute("aria-hidden", "true");
          (document.body || document.documentElement).appendChild(boot);
        }
        if (document.body) paintBoot();
        else document.addEventListener("DOMContentLoaded", paintBoot);
      })();
    </script>
