name: deploy-static-github-pages

# DISABLED: GitHub Pages is not a TDG production deployment path.
# Canonical path: Cursor Cloud Agent → bash scripts/deploy-production.sh → SSH → VPS.
# GitHub is source control only for TDG production origin.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub Pages production deploy is forbidden
        run: |
          echo "BLOCKED: TDG production must not deploy via GitHub Pages / Actions."
          echo "Use Cursor Cloud Agent secrets and: bash scripts/deploy-production.sh"
          exit 2
