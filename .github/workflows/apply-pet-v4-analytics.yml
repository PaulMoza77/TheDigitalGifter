name: apply-pet-v4-analytics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260910120000_pet_v4_sales_campaign_analytics.sql"
      - "supabase/functions/pet-funnel/**"
      - "supabase/functions/stripe-webhook/**"
      - "supabase/functions/pet-analytics-sync/**"
      - "supabase/functions/_shared/pet/**"
      - "scripts/apply-pet-v4-analytics.sh"
      - ".github/workflows/apply-pet-v4-analytics.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            exit 2
          fi
          echo "Supabase access token present (value not printed)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply V4 analytics migration + deploy edge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: kjlsocejpmnzhhduyumy
        run: |
          chmod +x scripts/apply-pet-v4-analytics.sh
          bash scripts/apply-pet-v4-analytics.sh
