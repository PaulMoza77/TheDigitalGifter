name: apply-christmas-wishlist-v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260909140000_christmas_wishlist_v2_reservations.sql"
      - "supabase/functions/christmas-wishlist-funnel/**"
      - "supabase/functions/_shared/christmas/giftTaxonomy.ts"
      - "scripts/apply-christmas-wishlist-v2.sh"
      - ".github/workflows/apply-christmas-wishlist-v2.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            exit 2
          fi
          echo "Supabase access token present (value not printed)."

      - name: Apply wishlist V2 migration + deploy edge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: kjlsocejpmnzhhduyumy
        run: |
          chmod +x scripts/apply-christmas-wishlist-v2.sh
          bash scripts/apply-christmas-wishlist-v2.sh
