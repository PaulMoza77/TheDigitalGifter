name: deploy-christmas-countdown

# Applies Christmas countdown schema and deploys christmas-admin (GA4 Data API).
# Uses Production environment secrets — same pattern as deploy-christmas-v2.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/christmas-countdown-admin-84e8
    paths:
      - "supabase/functions/christmas-admin/**"
      - "supabase/functions/_shared/christmas/**"
      - "supabase/migrations/20260908120000_christmas_countdown.sql"
      - "supabase/migrations/20260908140000_christmas_countdown_kpis_service_role.sql"
      - ".github/workflows/deploy-christmas-countdown.yml"
      - "scripts/deploy-christmas-countdown.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            echo "Add a Supabase PAT with deploy rights for kjlsocejpmnzhhduyumy."
            exit 2
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Christmas countdown schema + christmas-admin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/deploy-christmas-countdown.sh
