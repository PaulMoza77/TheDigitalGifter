name: apply-pet-multi-currency

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260912120000_pet_multi_currency.sql"
      - "scripts/apply-pet-multi-currency.sh"
      - ".github/workflows/apply-pet-multi-currency.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            exit 2
          fi
          echo "Supabase access token present (value not printed)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply multi-currency migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: kjlsocejpmnzhhduyumy
        run: |
          chmod +x scripts/apply-pet-multi-currency.sh
          bash scripts/apply-pet-multi-currency.sh
