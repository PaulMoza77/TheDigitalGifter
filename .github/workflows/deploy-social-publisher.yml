name: deploy-social-publisher

# Applies Meta + YouTube migrations, then deploys the existing social-publisher
# function. Does not enable live posts and does not deploy the frontend.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/social-publisher/**"
      - "supabase/functions/_shared/social/**"
      - "supabase/migrations/20260923180000_meta_login_publishing.sql"
      - "supabase/migrations/20260923190000_youtube_oauth_publishing.sql"
      - "scripts/deploy-social-publisher.sh"
      - ".github/workflows/deploy-social-publisher.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            echo "Add a Supabase PAT with Edge deploy rights for kjlsocejpmnzhhduyumy,"
            echo "then re-run this workflow. Refusing silent skip."
            exit 2
          fi
          echo "Supabase access token is present (value not printed)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply migrations and deploy social-publisher
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: kjlsocejpmnzhhduyumy
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CONFIGURATION_ID: ${{ secrets.META_CONFIGURATION_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
          MOZAS_SSH_HOST: ${{ secrets.MOZAS_SSH_HOST }}
          MOZAS_SSH_PRIVATE_KEY: ${{ secrets.MOZAS_SSH_PRIVATE_KEY }}
          MOZAS_SSH_USER: ${{ secrets.MOZAS_SSH_USER }}
        run: |
          set +x
          chmod +x scripts/deploy-social-publisher.sh
          if [ -z "${YOUTUBE_CLIENT_ID:-}" ] || [ -z "${YOUTUBE_CLIENT_SECRET:-}" ]; then
            if [ -n "${MOZAS_SSH_HOST:-}" ] && [ -n "${MOZAS_SSH_PRIVATE_KEY:-}" ]; then
              echo "Loading YouTube client config from VPS app.env (values masked, not printed)…"
              # shellcheck source=scripts/mozas-ssh.sh
              source scripts/mozas-ssh.sh
              mozas_prepare_ssh
              mozas_verify_remote_identity
              umask 077
              yt_env="$(mktemp)"
              mozas_ssh 'grep -E "^YOUTUBE_(CLIENT_ID|CLIENT_SECRET|REDIRECT_URI)=" /opt/mozas/projects/thedigitalgifter/secrets/app.env' > "$yt_env"
              while IFS= read -r line; do
                val="${line#*=}"
                [ -n "$val" ] && echo "::add-mask::$val"
              done < "$yt_env"
              set -a
              # shellcheck disable=SC1090
              source "$yt_env"
              set +a
              rm -f "$yt_env"
              echo "VPS YouTube config loaded."
            fi
          fi
          bash scripts/deploy-social-publisher.sh
