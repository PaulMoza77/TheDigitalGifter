name: deploy-pet-preview

# Deploys the free-preview edge function that owns identity prompts + species gate.

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/pet-preview-identity-c279
    paths:
      - "supabase/functions/pet-v2-preview/**"
      - "supabase/functions/_shared/pet/**"
      - ".github/workflows/deploy-pet-preview.yml"
      - "scripts/deploy-pet-preview.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prefer Production environment secrets (common place for deploy tokens).
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        id: token
        env:
          # Accept common aliases if the token was stored under another name.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not configured (repo or Production environment)."
            echo "Add a Supabase personal access token with deploy rights for kjlsocejpmnzhhduyumy."
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Cannot deploy without SUPABASE_ACCESS_TOKEN."
              exit 2
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.token.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy pet-v2-preview
        if: steps.token.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          REF="${SUPABASE_PROJECT_REF:-kjlsocejpmnzhhduyumy}"
          npx --yes supabase functions deploy pet-v2-preview \
            --project-ref "$REF" \
            --no-verify-jwt
          echo "Deployed pet-v2-preview to $REF"
          echo "Verify: curl -sS https://$REF.supabase.co/functions/v1/pet-v2-preview"
