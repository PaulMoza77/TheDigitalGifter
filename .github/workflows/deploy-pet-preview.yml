name: deploy-pet-preview

# Deploys the free-preview edge function that owns identity prompts + species gate.

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/pet-preview-identity-c279
    paths:
      - "supabase/functions/pet-v2-preview/**"
      - "supabase/functions/_shared/pet/**"
      - ".github/workflows/deploy-pet-preview.yml"
      - "scripts/deploy-pet-preview.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured on this repository."
            echo "Add a Supabase personal access token with deploy rights for kjlsocejpmnzhhduyumy."
            exit 2
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy pet-v2-preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          REF="${SUPABASE_PROJECT_REF:-kjlsocejpmnzhhduyumy}"
          npx --yes supabase functions deploy pet-v2-preview \
            --project-ref "$REF" \
            --no-verify-jwt
          echo "Deployed pet-v2-preview to $REF"
