name: apply-publisher-v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260923120000_publisher_v1.sql"
      - "scripts/apply-publisher-v1.sh"
      - ".github/workflows/apply-publisher-v1.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Publisher V1 migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: kjlsocejpmnzhhduyumy
        run: |
          chmod +x scripts/apply-publisher-v1.sh
          bash scripts/apply-publisher-v1.sh
