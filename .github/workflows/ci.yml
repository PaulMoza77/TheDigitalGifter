name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tdg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_CONCURRENT_TEST_URL: postgres://postgres:postgres@localhost:5432/tdg_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:edge
      - run: npm run verify:schedules
      - run: npm run build
      - run: git fetch --no-tags origin cursor/product-truth-cleanup-0c35
      - run: git diff --check origin/cursor/product-truth-cleanup-0c35...HEAD
