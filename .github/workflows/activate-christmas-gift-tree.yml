name: activate-christmas-gift-tree

# Production activation for PR #91 Christmas Gift Tree funnel.
# Applies gift-tree migrations + deploys required Edge functions.
# Uses Production environment secrets (same pattern as deploy-christmas-v2).

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            exit 2
          fi
          echo "token_present=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate Gift Tree (migrate + edge deploy)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/activate-christmas-gift-tree.sh

      - name: Verify remote gift-tree schema via service role
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::Missing service role/url secrets — skipping REST verify step."
            exit 0
          fi
          node <<'NODE'
          const url = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const headers = { apikey: key, Authorization: `Bearer ${key}`, Accept: 'application/json' };
          async function get(path) {
            const res = await fetch(url + path, { headers });
            const text = await res.text();
            return { status: res.status, text: text.slice(0, 500) };
          }
          (async () => {
            const checks = [];
            checks.push(['product', await get('/rest/v1/christmas_products?product_key=eq.christmas_gift_tree&select=id,product_key,active')]);
            checks.push(['opens', await get('/rest/v1/christmas_gift_tree_opens?select=id&limit=1')]);
            checks.push(['entitlements', await get('/rest/v1/christmas_reward_entitlements?select=id,email_normalized,redeemed_at,status&limit=1')]);
            const productJson = JSON.parse(checks[0][1].text || '[]');
            const productId = productJson[0]?.id;
            if (productId) {
              checks.push(['packages', await get(`/rest/v1/christmas_packages?product_id=eq.${productId}&select=package_key,price_cents,purchasable,metadata`)]);
            } else {
              checks.push(['packages', { status: 0, text: 'no_product_id' }]);
            }
            for (const [name, r] of checks) {
              console.log(name, r.status, r.text);
            }
            const productOk = checks[0][1].status === 200 && checks[0][1].text.includes('christmas_gift_tree');
            const opensOk = checks[1][1].status === 200;
            const packs = productId ? JSON.parse(checks[3][1].text || '[]') : [];
            const another = packs.find((p) => p.package_key === 'open_another');
            const five = packs.find((p) => p.package_key === 'open_five' || p.package_key === 'open_5');
            const packsOk = another?.price_cents === 199 && another?.purchasable === true && five?.price_cents === 499 && five?.purchasable === true;
            console.log('packsOk', packsOk, { another, five });
            if (!productOk || !opensOk || !packsOk) {
              console.error('VERIFY_FAILED');
              process.exit(2);
            }
            console.log('VERIFY_OK');
          })();
          NODE
