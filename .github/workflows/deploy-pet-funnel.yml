name: deploy-pet-funnel

# Safe Edge deploy for Meta attribution / checkout:
# pet-funnel + stripe-webhook (shared pet fulfill / CAPI Purchase).
# Does not deploy frontend or provider-status.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/apple-pay-contact-save-e17b
    paths:
      - "supabase/functions/pet-funnel/**"
      - "supabase/functions/stripe-webhook/**"
      - "supabase/functions/pet-analytics-sync/**"
      - "supabase/functions/_shared/pet/**"
      - "supabase/migrations/20260902120000_pet_funnel_exclude_internal_geos.sql"
      - ".github/workflows/deploy-pet-funnel.yml"
      - "scripts/deploy-pet-funnel.sh"
      - "scripts/deploy-exclude-internal-geos.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            echo "Add a Supabase PAT with Edge deploy rights for kjlsocejpmnzhhduyumy,"
            echo "then re-run this workflow. Refusing silent skip — safe deploy must be real."
            exit 2
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy pet-funnel + stripe-webhook + geo exclusion (safe)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/deploy-pet-funnel.sh
