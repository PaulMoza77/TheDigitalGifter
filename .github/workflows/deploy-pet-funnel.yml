name: deploy-pet-funnel

# Safe Edge-only deploy for pet-funnel (Apple Pay / contact update).
# Does not deploy frontend, provider-status, or other functions.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/apple-pay-contact-save-e17b
    paths:
      - "supabase/functions/pet-funnel/**"
      - "supabase/functions/_shared/pet/**"
      - ".github/workflows/deploy-pet-funnel.yml"
      - "scripts/deploy-pet-funnel.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not configured (repo or Production environment)."
            echo "Add a Supabase personal access token with deploy rights for kjlsocejpmnzhhduyumy."
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Cannot deploy without SUPABASE_ACCESS_TOKEN."
              exit 2
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.token.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy pet-funnel (safe)
        if: steps.token.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/deploy-pet-funnel.sh
