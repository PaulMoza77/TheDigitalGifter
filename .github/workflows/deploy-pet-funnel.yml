name: deploy-pet-funnel

# Safe Edge-only deploy for pet-funnel (Apple Pay / contact update).
# Does not deploy frontend, provider-status, or other functions.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/apple-pay-contact-save-e17b
    paths:
      - "supabase/functions/pet-funnel/**"
      - "supabase/functions/_shared/pet/**"
      - ".github/workflows/deploy-pet-funnel.yml"
      - "scripts/deploy-pet-funnel.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the Production environment."
            echo "Add a Supabase PAT with Edge deploy rights for kjlsocejpmnzhhduyumy,"
            echo "then re-run this workflow. Refusing silent skip — safe deploy must be real."
            exit 2
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy pet-funnel (safe)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.TDG_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/deploy-pet-funnel.sh
